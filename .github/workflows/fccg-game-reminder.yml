name: FCCG game reminder

on:
  schedule:
    # 한국시간 매일 오전 10:07 1회 실행.
    # 오늘 경기와 내일 경기를 한 번에 처리한다.
    - cron: "7 10 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      target:
        description: "dry-run으로 확인할 경기"
        required: true
        default: "today"
        type: choice
        options:
          - "today"
          - "tomorrow"

permissions:
  contents: read

concurrency:
  group: fccg-game-reminder
  cancel-in-progress: false

jobs:
  trigger:
    name: Wake Render and run game reminder
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call protected reminder endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.FCCG_CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$CRON_SECRET"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 수동 dryRun: 선택한 날만 확인
            if [ "$MANUAL_TARGET" = "tomorrow" ]; then
              request_body='{"dryRun":true,"targetOffsetDays":1}'
            else
              request_body='{"dryRun":true,"targetOffsetDays":0}'
            fi
          else
            # 자동 실행: 오늘·내일 모두 처리 (targetOffsetDays 없음)
            request_body='{"dryRun":false}'
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 20 \
            --max-time 240 \
            --request POST \
            "${BACKEND_URL%/}/api/cron/game-reminder" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data "$request_body"
